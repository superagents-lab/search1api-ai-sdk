name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 18, ai: 5, zod: 3 }
          - { node: 18, ai: 5, zod: 4 }
          - { node: 22, ai: 6, zod: 3 }
          - { node: 22, ai: 6, zod: 4 }
          - { node: 24, ai: 7, zod: 3 }
          - { node: 24, ai: 7, zod: 4 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false ai@${{ matrix.ai }} zod@${{ matrix.zod }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npm pack --dry-run
